name: Deploy Standard Checkout

on:
  repository_dispatch:
    types: [deploy_standard_xcframework]
  push:
    branches:
      - master

env:
  DEPLOYMENT_VERSION: ${{ github.event.client_payload.version || '' }}
  IS_RC: ${{ github.event.client_payload.is_rc || '' }}
  CORE_CHANGED: ${{ github.event.client_payload.core_changed || 'false' }}
  ARTIFACT_REPOSITORY: ${{ github.event.client_payload.source_repo || '' }}
  ARTIFACT_RUN_ID: ${{ github.event.client_payload.run_id || '' }}
  SDK_ARTIFACT: ${{ github.event.client_payload.artifacts.sdk || '' }}
  CHECKSUM_SDK: ${{ github.event.client_payload.checksums.sdk || '' }}

jobs:
  deploy:
    name: Deploy and open PR
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.CI_BOT_TOKEN }}
          fetch-depth: 1

      - name: Validate dispatch payload
        run: |
          set -euo pipefail

          REQUIRED_VARS=(
            DEPLOYMENT_VERSION
            ARTIFACT_REPOSITORY
            ARTIFACT_RUN_ID
            SDK_ARTIFACT
            CHECKSUM_SDK
          )

          for var_name in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "❌ Missing required payload value: ${var_name}"
              exit 1
            fi
          done

      - name: Create release branch
        run: |
          set -euo pipefail

          RELEASE_BRANCH="release/v${DEPLOYMENT_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${RELEASE_BRANCH}:${RELEASE_BRANCH}" 2>/dev/null || true

          if git show-ref --verify --quiet "refs/heads/${RELEASE_BRANCH}"; then
            git checkout "${RELEASE_BRANCH}"
          else
            git checkout -b "${RELEASE_BRANCH}"
          fi

      - name: Download SDK XCFramework zip artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.CI_BOT_TOKEN }}
          repository: ${{ env.ARTIFACT_REPOSITORY }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          name: ${{ env.SDK_ARTIFACT }}
          path: /tmp/artifacts/sdk

      - name: Verify artifact and replace vendored XCFramework
        run: |
          set -euo pipefail

          find_archive() {
            local input_dir="$1"
            local archive_name="$2"
            local discovered

            discovered=$(find "$input_dir" -name "$archive_name" -type f | head -1)
            if [ -z "$discovered" ]; then
              echo "❌ ${archive_name} not found in ${input_dir}"
              find "$input_dir" -maxdepth 3 -type f
              exit 1
            fi
            printf '%s\n' "$discovered"
          }

          verify_archive_sha() {
            local archive_path="$1"
            local label="$2"
            local expected_sha="$3"
            local actual_sha

            actual_sha=$(shasum -a 256 "$archive_path" | awk '{print $1}')

            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "❌ Checksum mismatch for ${label}"
              echo "   Expected: ${expected_sha}"
              echo "   Actual:   ${actual_sha}"
              exit 1
            fi
          }

          require_xcframework() {
            local input_dir="$1"
            local expected_name="$2"
            local discovered

            discovered=$(find "$input_dir" -name "$expected_name" -type d | head -1)
            if [ -z "$discovered" ]; then
              echo "❌ ${expected_name} not found after unzip"
              find "$input_dir" -maxdepth 4 \( -type d -o -type f \)
              exit 1
            fi
            printf '%s\n' "$discovered"
          }

          SDK_ARCHIVE=$(find_archive /tmp/artifacts/sdk sdk-xcframework.zip)
          verify_archive_sha "$SDK_ARCHIVE" "RazorpayStandard.xcframework" "$CHECKSUM_SDK"

          rm -rf /tmp/sdk-artifact
          mkdir -p /tmp/sdk-artifact
          unzip -q "$SDK_ARCHIVE" -d /tmp/sdk-artifact

          SDK_XCFW=$(require_xcframework /tmp/sdk-artifact RazorpayStandard.xcframework)

          rm -rf Pod/RazorpayStandard.xcframework
          cp -R "$SDK_XCFW" Pod/RazorpayStandard.xcframework

          echo "✅ Replaced Pod/RazorpayStandard.xcframework"

      - name: Update podspec version
        run: |
          set -euo pipefail

          chmod +x .github/scripts/update_podspec_version.sh
          ./.github/scripts/update_podspec_version.sh "${DEPLOYMENT_VERSION}"

          echo "✅ Podspec updated to v${DEPLOYMENT_VERSION}"
          grep "s.version" razorpay-pod.podspec

      - name: Commit and push
        run: |
          set -euo pipefail

          RELEASE_BRANCH="release/v${DEPLOYMENT_VERSION}"

          git add Pod/RazorpayStandard.xcframework razorpay-pod.podspec

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: release standard checkout v${DEPLOYMENT_VERSION}"
          git push origin "${RELEASE_BRANCH}"

      - name: Create pull request
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_BRANCH="release/v${DEPLOYMENT_VERSION}"

          PR_BODY=$(cat <<EOF
          ## Standard Checkout v${DEPLOYMENT_VERSION}

          ### Updated artifacts
          - Updated \`Pod/RazorpayStandard.xcframework\`
          - Bumped \`razorpay-pod.podspec\` to \`${DEPLOYMENT_VERSION}\`

          ---
          Opened automatically by CI.
          EOF
          )

          HTTP_STATUS=$(curl --silent --output /tmp/pr_response.json --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/razorpay/razorpay-pod/pulls" \
            -d "$(jq -n \
              --arg title "release: v${DEPLOYMENT_VERSION}" \
              --arg body "$PR_BODY" \
              --arg head "$RELEASE_BRANCH" \
              --arg base "master" \
              '{title: $title, body: $body, head: $head, base: $base}')")

          if [ "$HTTP_STATUS" -eq 201 ]; then
            PR_URL=$(jq -r '.html_url' /tmp/pr_response.json)
            echo "✅ PR created: ${PR_URL}"
          elif [ "$HTTP_STATUS" -eq 422 ]; then
            echo "⚠️ PR already exists"
            jq -r '.errors[0].message // .message' /tmp/pr_response.json
          else
            echo "❌ Failed to create PR (HTTP ${HTTP_STATUS})"
            cat /tmp/pr_response.json
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Deploy Standard Checkout v${DEPLOYMENT_VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${DEPLOYMENT_VERSION}\` |"
            echo "| RC | ${IS_RC} |"
            echo "| RazorpayStandard.xcframework | ✅ replaced |"
            echo "| PR | opened to master |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag, release, and publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_BOT_TOKEN }}
          fetch-depth: 1

      - name: Read version from podspec
        id: version
        run: |
          set -euo pipefail

          chmod +x .github/scripts/read-podspec-version.sh
          VERSION=$(./.github/scripts/read-podspec-version.sh)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Detect release state
        id: state
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="${VERSION_OUTPUT}"
          TAG_NAME="v${VERSION}"
          TAG_EXISTS="false"
          RELEASE_EXISTS="false"
          RELEASE_URL=""
          POD_PUBLISHED="false"

          if git ls-remote --tags origin "${TAG_NAME}" | grep -q "${TAG_NAME}$"; then
            TAG_EXISTS="true"
          fi

          HTTP_STATUS=$(curl --silent --output /tmp/release_response.json --write-out "%{http_code}" \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/razorpay/razorpay-pod/releases/tags/${TAG_NAME}")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            RELEASE_EXISTS="true"
            RELEASE_URL=$(jq -r '.html_url' /tmp/release_response.json)
          elif [ "$HTTP_STATUS" -ne 404 ]; then
            echo "❌ Failed to read GitHub release state (HTTP ${HTTP_STATUS})"
            cat /tmp/release_response.json
            exit 1
          fi

          POD_INFO=$(pod trunk info razorpay-pod 2>/dev/null || true)
          if printf '%s\n' "$POD_INFO" | grep -Eq "(^|[[:space:]])${VERSION}([[:space:]]|$)"; then
            POD_PUBLISHED="true"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "tag_exists=${TAG_EXISTS}"
            echo "release_exists=${RELEASE_EXISTS}"
            echo "release_url=${RELEASE_URL}"
            echo "pod_published=${POD_PUBLISHED}"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.state.outputs.tag_exists != 'true'
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
          TAG_NAME_OUTPUT: ${{ steps.state.outputs.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${VERSION_OUTPUT}"
          TAG_NAME="${TAG_NAME_OUTPUT}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release Standard Checkout ${VERSION}"
          git push origin "${TAG_NAME}"

          echo "✅ Tagged ${TAG_NAME}"

      - name: Create GitHub Release
        if: steps.state.outputs.release_exists != 'true'
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
          TAG_NAME_OUTPUT: ${{ steps.state.outputs.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${VERSION_OUTPUT}"
          TAG_NAME="${TAG_NAME_OUTPUT}"
          IS_PRERELEASE="false"

          if [[ "$VERSION" == *"-rc"* ]]; then
            IS_PRERELEASE="true"
          fi

          HTTP_STATUS=$(curl --silent --output /tmp/release_response.json --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/razorpay/razorpay-pod/releases" \
            -d "$(jq -n \
              --arg tag_name "${TAG_NAME}" \
              --arg name "Standard Checkout ${VERSION}" \
              --arg target "master" \
              --argjson prerelease ${IS_PRERELEASE} \
              --argjson generate_release_notes true \
              '{tag_name: $tag_name, name: $name, target_commitish: $target, prerelease: $prerelease, generate_release_notes: $generate_release_notes}')")

          if [ "$HTTP_STATUS" -eq 201 ]; then
            RELEASE_URL=$(jq -r '.html_url' /tmp/release_response.json)
            echo "✅ GitHub Release created: ${RELEASE_URL}"
          elif [ "$HTTP_STATUS" -eq 422 ]; then
            echo "⚠️ Release already exists for ${TAG_NAME}"
          else
            echo "❌ Failed to create release (HTTP ${HTTP_STATUS})"
            cat /tmp/release_response.json
            exit 1
          fi

      - name: Publish to CocoaPods
        if: steps.state.outputs.pod_published != 'true'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -euo pipefail

          pod lib lint razorpay-pod.podspec --allow-warnings
          pod trunk push razorpay-pod.podspec --allow-warnings

      - name: Job summary
        if: always()
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
          TAG_NAME_OUTPUT: ${{ steps.state.outputs.tag_name }}
          TAG_EXISTS_OUTPUT: ${{ steps.state.outputs.tag_exists }}
          RELEASE_EXISTS_OUTPUT: ${{ steps.state.outputs.release_exists }}
          POD_PUBLISHED_OUTPUT: ${{ steps.state.outputs.pod_published }}
        run: |
          {
            echo "## Released Standard Checkout v${VERSION_OUTPUT}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${TAG_NAME_OUTPUT}\` |"
            if [ "${TAG_EXISTS_OUTPUT}" = "true" ]; then
              echo "| Tag action | skipped (already exists) |"
            else
              echo "| Tag action | created |"
            fi
            if [ "${RELEASE_EXISTS_OUTPUT}" = "true" ]; then
              echo "| GitHub Release | skipped (already exists) |"
            else
              echo "| GitHub Release | created |"
            fi
            if [ "${POD_PUBLISHED_OUTPUT}" = "true" ]; then
              echo "| CocoaPods | skipped (already published) |"
            else
              echo "| CocoaPods | published |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
